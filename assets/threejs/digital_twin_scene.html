<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SAFENAV Digital Twin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: relative; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; text-align: center; z-index: 100; }
        #loading .spinner { border: 4px solid #333; border-top: 4px solid #1976d2; border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #room-info { position: absolute; bottom: 20px; left: 20px; right: 20px; background: rgba(0,0,0,0.85); color: #fff; padding: 16px; border-radius: 12px; display: none; z-index: 50; backdrop-filter: blur(10px); }
        #room-info.visible { display: block; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        #room-info h3 { margin: 0 0 8px; font-size: 1.1rem; color: #90caf9; }
        #room-info p { margin: 4px 0; font-size: 0.9rem; color: #ccc; }
        #floor-indicator { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.85); color: #fff; padding: 12px 16px; border-radius: 8px; z-index: 50; backdrop-filter: blur(10px); font-size: 0.9rem; }
        #theme-toggle { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; z-index: 50; backdrop-filter: blur(10px); font-size: 0.9rem; }
        #theme-toggle:hover { background: rgba(25,118,210,0.9); }
        .exploded { animation: explode 0.5s ease forwards; }
        @keyframes explode { from { transform: translateZ(0); } to { transform: translateZ(20px); } }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="loading">
            <div class="spinner"></div>
            <div>Loading 3D Campus...</div>
        </div>
        <button id="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
        <div id="floor-indicator">Floor: Ground</div>
        <div id="room-info">
            <h3 id="room-name">Room Name</h3>
            <p id="room-number">Room Number: -</p>
            <p id="room-category">Category: -</p>
            <p id="room-floor">Floor: -</p>
        </div>
    </div>

    <!-- Three.js and dependencies -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        // Global state
        let scene, camera, renderer, controls;
        let buildingGroup = new THREE.Group();
        let rooms = new Map(); // roomId -> { mesh, floor, originalMaterial, data }
        let floors = new Map(); // floorIndex -> Group
        let currentFloor = 0;
        let currentTheme = 'dark';
        let highlightedRoom = null;
        let isExploded = false;
        let buildingMetadata = null;

        // Materials for themes
        const themes = {
            light: {
                background: 0xf5f5f5,
                floor: 0xe0e0e0,
                ceiling: 0xffffff,
                wall: 0xcccccc,
                wallHighlight: 0x1976d2,
                grid: 0xcccccc,
                text: 0x000000
            },
            dark: {
                background: 0x1a1a2e,
                floor: 0x2d2d44,
                ceiling: 0x1a1a2e,
                wall: 0x3d3d5c,
                wallHighlight: 0x64b5f6,
                grid: 0x333344,
                text: 0xffffff
            },
            emergency: {
                background: 0x000000,
                floor: 0x1a0000,
                ceiling: 0x000000,
                wall: 0x330000,
                wallHighlight: 0xff0000,
                grid: 0x330000,
                text: 0xffffff
            }
        };

        // Initialize Three.js scene
        async function init() {
            const container = document.getElementById('canvas-container');
            const loading = document.getElementById('loading');

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(themes.dark.background);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(50, 50, 50);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = true;
            controls.minDistance = 5;
            controls.maxDistance = 200;
            controls.maxPolarAngle = Math.PI / 2 - 0.01;

            // Lighting
            setupLighting();

            // Grid helper
            const gridHelper = new THREE.GridHelper(100, 50, themes.dark.grid, themes.dark.grid);
            gridHelper.position.y = -0.1;
            scene.add(gridHelper);

            // Add building group
            scene.add(buildingGroup);

            // Hide loading - wait for Flutter to send loadBuilding message
            loading.style.display = 'none';

            // Start render loop
            animate();

            // Handle window resize
            window.addEventListener('resize', onWindowResize);
        }

        function setupLighting() {
            // Ambient light
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            // Directional light (sun)
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 200;
            dirLight.shadow.camera.left = -100;
            dirLight.shadow.camera.right = 100;
            dirLight.shadow.camera.top = 100;
            dirLight.shadow.camera.bottom = -100;
            scene.add(dirLight);

            // Hemisphere light for subtle fill
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4);
            scene.add(hemiLight);
        }

        async function loadBuilding(buildingId) {
            try {
                // Clear previous building if any
                if (buildingGroup.children.length > 0) {
                    buildingGroup.clear();
                    rooms.clear();
                    floors.clear();
                }

                // Load metadata first
                const metaResponse = await fetch(`assets/3d/${buildingId}_metadata.json`);
                buildingMetadata = await metaResponse.json();

                // Load GLB model
                const loader = new GLTFLoader();

                // Setup DRACO loader for compressed models
                const dracoLoader = new DRACOLoader();
                dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
                loader.setDRACOLoader(dracoLoader);

                const gltf = await new Promise((resolve, reject) => {
                    loader.load(
                        `assets/3d/${buildingId}.glb`,
                        resolve,
                        (xhr) => {
                            const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
                            document.querySelector('#loading div:last-child').textContent = `Loading ${buildingId}... ${percent}%`;
                        },
                        reject
                    );
                });

                // Add to building group
                buildingGroup.add(gltf.scene);

                // Register rooms by mesh name
                gltf.scene.traverse((child) => {
                    if (child.isMesh && child.name.startsWith('room_')) {
                        const roomId = child.name;
                        const floor = getFloorFromRoomName(roomId);

                        // Store original material
                        const originalMaterial = child.material.clone();

                        rooms.set(roomId, {
                            mesh: child,
                            floor: floor,
                            originalMaterial: originalMaterial,
                            data: buildingMetadata.rooms?.[roomId] || {}
                        });

                        // Set initial material based on theme
                        applyThemeToMesh(child, currentTheme);

                        // Add to floor group
                        if (!floors.has(floor)) {
                            floors.set(floor, new THREE.Group());
                            buildingGroup.add(floors.get(floor));
                        }
                        // Move mesh to floor group (but keep in buildingGroup for now)
                    }
                });

                // Organize by floor
                organizeByFloor();

                // Set initial floor visibility
                showFloor(currentFloor);

                // Fit camera to building
                fitCameraToBuilding();

            } catch (error) {
                console.error('Error loading building:', error);
                sendToFlutter('onError', { message: error.message });
            }
        }

        function getFloorFromRoomName(roomName) {
            // room_main_building_ground_floor_room_001 -> 0
            // room_main_building_2nd_floor_room_001 -> 1
            // room_main_building_3rd_floor_room_001 -> 2
            const match = roomName.match(/_(ground|1st|2nd|3rd)_floor_/);
            if (match) {
                const floorMap = { 'ground': 0, '1st': 1, '2nd': 2, '3rd': 3 };
                return floorMap[match[1]] || 0;
            }
            return 0;
        }

        function organizeByFloor() {
            // Reorganize meshes into floor groups
            rooms.forEach((room, roomId) => {
                const floorGroup = floors.get(room.floor);
                if (floorGroup && room.mesh.parent !== floorGroup) {
                    // Detach from current parent and attach to floor group
                    room.mesh.parent.remove(room.mesh);
                    floorGroup.add(room.mesh);
                }
            });
        }

        function applyThemeToMesh(mesh, themeName) {
            const theme = themes[themeName];
            if (!theme) return;

            const material = mesh.material;
            if (material.isMeshStandardMaterial || material.isMeshPhongMaterial || material.isMeshBasicMaterial) {
                // Determine material type based on mesh name or userData
                if (mesh.name.includes('floor') || mesh.userData.isFloor) {
                    material.color.setHex(theme.floor);
                } else if (mesh.name.includes('ceiling') || mesh.userData.isCeiling) {
                    material.color.setHex(theme.ceiling);
                } else {
                    material.color.setHex(theme.wall);
                }
                material.needsUpdate = true;
            }
        }

        function setTheme(themeName) {
            if (!themes[themeName]) return;
            currentTheme = themeName;
            const theme = themes[themeName];

            // Update scene background
            scene.background = new THREE.Color(theme.background);

            // Update all room materials
            rooms.forEach((room) => {
                if (room.mesh !== highlightedRoom) {
                    applyThemeToMesh(room.mesh, themeName);
                }
            });

            // Update grid
            scene.children.forEach(child => {
                if (child.isGridHelper) {
                    child.material.color.setHex(theme.grid);
                }
            });

            // Update theme toggle button
            const btn = document.getElementById('theme-toggle');
            if (btn) {
                const icons = { light: '🌙', dark: '☀️', emergency: '🚨' };
                btn.textContent = `${icons[themeName]} ${themeName.charAt(0).toUpperCase() + themeName.slice(1)} Mode`;
            }
        }

        function toggleTheme() {
            const themeOrder = ['dark', 'light', 'emergency'];
            const currentIndex = themeOrder.indexOf(currentTheme);
            const nextIndex = (currentIndex + 1) % themeOrder.length;
            setTheme(themeOrder[nextIndex]);
        }

        function showFloor(floorIndex) {
            currentFloor = floorIndex;

            // Update floor indicator
            const floorNames = ['Ground', '2nd', '3rd'];
            const indicator = document.getElementById('floor-indicator');
            if (indicator) {
                indicator.textContent = `Floor: ${floorNames[floorIndex] || floorIndex}`;
            }

            // Show/hide floors with animation
            floors.forEach((floorGroup, floor) => {
                const visible = floor === floorIndex || floor === floorIndex - 1; // Show current and floor below for context
                floorGroup.visible = visible;

                // Fade animation
                floorGroup.traverse(child => {
                    if (child.isMesh && child.material) {
                        child.material.transparent = !visible;
                        child.material.opacity = visible ? 1 : 0.1;
                        child.material.needsUpdate = true;
                    }
                });
            });

            sendToFlutter('onFloorChanged', { floorIndex });
        }

        function setFloorVisibility(floorIndex, visible, opacity = 1) {
            const floorGroup = floors.get(floorIndex);
            if (floorGroup) {
                floorGroup.visible = visible;
                floorGroup.traverse(child => {
                    if (child.isMesh && child.material) {
                        child.material.transparent = !visible || opacity < 1;
                        child.material.opacity = visible ? opacity : 0;
                        child.material.needsUpdate = true;
                    }
                });
            }
        }

        function setExplodedView(enabled, separation = 5) {
            isExploded = enabled;
            const floorHeight = 3.5;

            floors.forEach((floorGroup, floor) => {
                if (enabled) {
                    const offset = floor * separation;
                    floorGroup.position.y = offset;
                } else {
                    floorGroup.position.y = floor * floorHeight;
                }
            });
        }

        function highlightRoom(roomId, color = null) {
            const room = rooms.get(roomId);
            if (!room) return;

            // Clear previous highlight
            if (highlightedRoom && highlightedRoom !== room.mesh) {
                const prevRoom = Array.from(rooms.values()).find(r => r.mesh === highlightedRoom);
                if (prevRoom) {
                    highlightedRoom.material.dispose();
                    highlightedRoom.material = prevRoom.originalMaterial.clone();
                    applyThemeToMesh(highlightedRoom, currentTheme);
                }
            }

            // Apply highlight
            highlightedRoom = room.mesh;
            const highlightMaterial = room.originalMaterial.clone();
            highlightMaterial.color.setHex(color || themes[currentTheme].wallHighlight);
            highlightMaterial.emissive = new THREE.Color(color || themes[currentTheme].wallHighlight);
            highlightMaterial.emissiveIntensity = 0.3;
            highlightMaterial.transparent = true;
            highlightMaterial.opacity = 0.9;
            room.mesh.material = highlightMaterial;

            // Show room info panel
            showRoomInfo(room);
        }

        function clearHighlight(roomId) {
            const room = rooms.get(roomId);
            if (!room || room.mesh !== highlightedRoom) return;

            highlightedRoom.material.dispose();
            highlightedRoom.material = room.originalMaterial.clone();
            applyThemeToMesh(highlightedRoom, currentTheme);
            highlightedRoom = null;

            hideRoomInfo();
        }

        function showRoomInfo(room) {
            const info = document.getElementById('room-info');
            const data = room.data;

            document.getElementById('room-name').textContent = data.name || room.mesh.name;
            document.getElementById('room-number').textContent = `Room Number: ${data.number || 'N/A'}`;
            document.getElementById('room-category').textContent = `Category: ${data.category || 'N/A'}`;
            document.getElementById('room-floor').textContent = `Floor: ${room.floor}`;

            info.classList.add('visible');
        }

        function hideRoomInfo() {
            const info = document.getElementById('room-info');
            info.classList.remove('visible');
        }

        function flyToRoom(roomId, duration = 1000) {
            const room = rooms.get(roomId);
            if (!room) return;

            const box = new THREE.Box3().setFromObject(room.mesh);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const distance = maxDim * 3;

            const targetPosition = center.clone();
            targetPosition.z += distance;
            targetPosition.y += distance * 0.5;

            animateCamera(camera.position, targetPosition, center, duration);
        }

        function animateCamera(from, to, target, duration) {
            const startTime = Date.now();

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = easeInOutCubic(progress);

                camera.position.lerpVectors(from, to, eased);
                controls.target.lerp(target, eased);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            animate();
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function fitCameraToBuilding() {
            const box = new THREE.Box3().setFromObject(buildingGroup);
            if (box.isEmpty()) return;

            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
            cameraZ *= 1.5; // Add some padding

            camera.position.set(center.x, center.y + maxDim * 0.5, center.z + cameraZ);
            controls.target.copy(center);
            controls.update();
        }

        // Raycasting for mouse interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function onMouseMove(event) {
            // Calculate mouse position in normalized device coordinates
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Only check rooms on current floor
            const meshes = [];
            rooms.forEach(room => {
                if (room.floor === currentFloor || room.floor === currentFloor - 1) {
                    meshes.push(room.mesh);
                }
            });

            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0) {
                const roomId = intersects[0].object.name;
                if (roomId !== (highlightedRoom?.name)) {
                    highlightRoom(roomId);
                    sendToFlutter('onRoomHovered', { roomId });
                }
            } else if (highlightedRoom) {
                clearHighlight(highlightedRoom.name);
            }
        }

        function onMouseDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const meshes = [];
            rooms.forEach(room => {
                if (room.floor === currentFloor || room.floor === currentFloor - 1) {
                    meshes.push(room.mesh);
                }
            });

            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0) {
                const roomId = intersects[0].object.name;
                sendToFlutter('onRoomSelected', { roomId });
            }
        }

        // Event listeners
        window.addEventListener('mousemove', onMouseMove, { passive: true });
        window.addEventListener('mousedown', onMouseDown, { passive: true });

        // Touch support
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                onMouseMove(e.touches[0]);
            }
        }, { passive: true });

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                onMouseDown(e.touches[0]);
            }
        }, { passive: true });

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Communication with Flutter
        function sendToFlutter(method, data) {
            if (window.flutter_inappwebview) {
                window.flutter_inappwebview.callHandler(method, JSON.stringify(data));
            } else if (window.webkit && window.webkit.messageHandlers) {
                // iOS WebKit
                window.webkit.messageHandlers[method].postMessage(data);
            } else {
                // Fallback: postMessage
                window.parent.postMessage({ method, data }, '*');
            }
        }

        // Listen for messages from Flutter
        window.addEventListener('message', (event) => {
            if (!event.data || !event.data.method) return;

            const { method, data } = event.data;

            switch (method) {
                case 'loadBuilding':
                    loadBuilding(data.buildingId);
                    break;
                case 'showFloor':
                    showFloor(data.floorIndex);
                    break;
                case 'setFloorVisibility':
                    setFloorVisibility(data.floorIndex, data.visible, data.opacity);
                    break;
                case 'highlightRoom':
                    highlightRoom(data.roomId, data.color);
                    break;
                case 'clearHighlight':
                    clearHighlight(data.roomId);
                    break;
                case 'flyToRoom':
                    flyToRoom(data.roomId, data.duration);
                    break;
                case 'setTheme':
                    setTheme(data.theme);
                    break;
                case 'setExplodedView':
                    setExplodedView(data.enabled, data.separation);
                    break;
                case 'setCameraPosition':
                    camera.position.set(data.x, data.y, data.z);
                    controls.update();
                    break;
            }
        });

        // Also listen for flutter_inappwebview calls (Android)
        if (window.flutter_inappwebview) {
            // The channel is set up by Flutter
        }

        // Initialize
        init().catch(console.error);
    </script>
</body>
</html>
