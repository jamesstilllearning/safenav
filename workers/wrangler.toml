
name = "safenav-cavite-workers"
main = "src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# Environment variables
[vars]
FIREBASE_PROJECT_ID = "safenav-cavite"
FIREBASE_REGION = "us-central1"
ENVIRONMENT = "production"

# Production KV namespace
[[kv_namespaces]]
binding = "KV"
id = "464cb34d18bd4733908b6160ef6f9269"

# Cron triggers
[triggers]
crons = [
  "0 2 * * *",
  "0 3 * * *",
  "0 4 * * *",
  "0 * * * *",
]

# Observability
[observability]
enabled = true
head_sampling_rate = 0.1

# Staging environment
[env.staging]
name = "safenav-cavite-workers-staging"

[env.staging.vars]
FIREBASE_PROJECT_ID = "safenav-cavite"
FIREBASE_REGION = "us-central1"
ENVIRONMENT = "staging"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "656edd28b4d440598bd4f814ecdea5ee"

# Production environment
[env.production]
name = "safenav-cavite-workers"
vars = { ENVIRONMENT = "production" }

# Build configuration
[build]
command = "echo 'No build step needed - TypeScript compiled by Wrangler'"
