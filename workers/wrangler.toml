name = "safenav-cavite-workers"
main = "src/index.ts"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# Environment variables (non-secret)
[vars]
FIREBASE_PROJECT_ID = "safenav-cavite"
FIREBASE_REGION = "us-central1"
ENVIRONMENT = "production"

# Cron triggers for scheduled functions
[triggers]
crons = [
  "0 2 * * *",  # cleanupExpiredAlerts - Daily 02:00 UTC
  "0 3 * * *",  # dailyAnalytics - Daily 03:00 UTC
  "0 4 * * *",  # cleanupStaleTokens - Daily 04:00 UTC
  "0 * * * *",  # refreshFCMTopics - Hourly
]

# KV namespace for OAuth/JWKS caching
# Create these with: npx wrangler kv:namespace create "KV" (production) and npx wrangler kv:namespace create "KV" --env staging (staging)
[[kv_namespaces]]
binding = "KV"
id = "PRODUCTION_KV_NAMESPACE_ID"  # Replace after creating: npx wrangler kv:namespace create "KV"
preview_id = "STAGING_KV_NAMESPACE_ID"  # Replace after creating: npx wrangler kv:namespace create "KV" --env staging

# Observability
[observability]
enabled = true
head_sampling_rate = 0.1

# Environment-specific overrides
[env.staging]
name = "safenav-cavite-workers-staging"
vars = { ENVIRONMENT = "staging" }

[env.production]
name = "safenav-cavite-workers"
vars = { ENVIRONMENT = "production" }

# Build configuration
[build]
command = "echo 'No build step needed - TypeScript compiled by Wrangler'"