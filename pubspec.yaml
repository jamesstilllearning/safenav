name: safenav_cavite
description: "SAFENAV CAVITE: A Mobile-Based Campus Navigation and Emergency Evacuation System with Real-Time Mapping for EARIST Cavite Campus."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.8.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4

  # Maps (OpenStreetMap via flutter_map)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_tile_caching: ^9.0.1
  http: ^1.2.2

  # Google Maps & Location (kept for location services, not map display)
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.3.0

  # Local Storage & Offline Support
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # Permissions
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.5
  collection: ^1.19.0
  meta: ^1.15.0

  # Text-to-Speech for voice guidance
  flutter_tts: ^4.1.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # UI & Media
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  google_fonts: ^6.2.1

  # Code Generation (annotations)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true

  assets:
    - lib/src/features/map/data/campus_boundary.geojson
    - lib/src/features/map/data/campus_buildings.geojson
    - lib/src/features/map/data/campus_pathways.geojson