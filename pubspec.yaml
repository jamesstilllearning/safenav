name: safenav_cavite
description: "SAFENAV CAVITE: A Mobile-Based Campus Navigation and Emergency Evacuation System with Real-Time Mapping for EARIST Cavite Campus."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.8.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  firebase_messaging: ^17.1.0
  firebase_storage: ^14.1.0
  cloud_functions: ^7.1.0
  firebase_app_check: ^0.5.2
  firebase_crashlytics: ^6.1.0

  # Maps (OpenStreetMap via flutter_map)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  path_provider: ^2.1.4

  # Google Maps & Location (kept for location services, not map display)
  geolocator: ^13.0.1
  geocoding: ^5.0.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.3.0

  # Local Storage & Offline Support
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # Permissions
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  share_plus: ^13.0.0
  image_picker: ^1.1.2

  # Connectivity monitoring
  connectivity_plus: ^6.0.5

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.5
  collection: ^1.19.0
  meta: ^1.15.0

  # Text-to-Speech for voice guidance
  flutter_tts: ^4.2.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # UI & Media
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  google_fonts: ^6.2.1

  # WebView for 3D digital twin
  webview_flutter: ^4.4.2
  webview_flutter_android: ^3.16.1
  webview_flutter_wkwebview: ^3.16.1

  # Code Generation (annotations)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  material_ui: ^0.0.1
  cupertino_ui: ^0.0.1
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

  # Code Generation
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true

  assets:
    - lib/src/features/map/data/campus_boundary.geojson
    - lib/src/features/map/data/campus_buildings.geojson
    - lib/src/features/map/data/campus_pathways.geojson
    - assets/config/gcp_config.development.json
    - assets/config/gcp_config.example.json
    - assets/config/gcp_config.schema.json
    - assets/threejs/digital_twin_scene.html
    - assets/maps/campus_illustration.svg
    - assets/maps/navigation_graph.svg
    - assets/maps/navigation/edge_mapping.json
    - assets/maps/navigation/graph_validation_report.json
    - assets/maps/navigation/navigation_graph.json
    - assets/maps/navigation/node_mapping.json
    - "assets/earist_logo/earist logo.jpg"
